      <stop offset="0%" stop-color="#cc2329"/>
      <stop offset="100%" stop-color="#991418"/>
    </linearGradient>
    <linearGradient id="goldKnot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae092"/>
      <stop offset="50%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#a68442"/>
